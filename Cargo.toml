[package]
name = "fsdecrypt"
version = "0.1.4"
edition = "2021"

[dependencies]
aes = "0.8.4"
anyhow = "1.0.100"
cbc = "0.1.2"
crc32fast = "1.5.0"
hex-literal = "1.0.0"
indicatif = "0.18.0"
exfat-fs = "0.1.3"
chrono = "0.4.42"
clap = { version = "4.5.48", features = ["derive"] }
ntfs = "0.4.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "none"
